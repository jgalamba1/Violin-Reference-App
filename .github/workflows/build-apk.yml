name: Build Android APK (Version Fixed)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with: 
          java-version: '21'
          distribution: 'temurin'
        
      - name: Install Dependencies
        run: |
          # Use --legacy-peer-deps to force NPM to ignore the version conflicts
          npm install --legacy-peer-deps
          # Pin these to @6 to match your @capacitor/core@6.2.1
          npm install -D @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
        
      - name: Build Web App
        run: npm run build
        
      - name: Generate and Patch Android Folder
        run: |
          # Create the folder, ignore error if it already exists
          npx cap add android || true
          
          # 1. DISABLE JETIFIER (The fix for Bouncy Castle crash)
          # We use '|| true' and check if file exists to prevent exit codes
          if [ -f android/gradle.properties ]; then
            sed -i 's/android.enableJetifier=true/android.enableJetifier=false/g' android/gradle.properties
            # If the line didn't exist, append it
            grep -q "android.enableJetifier" android/gradle.properties || echo "android.enableJetifier=false" >> android/gradle.properties
          fi
          
          # 2. FORCE SDK VERSIONS
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/g' android/variables.gradle
          fi
      
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/violin-reference.jks

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$PWD/app/violin-reference.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: violin-reference-release
          path: android/app/build/outputs/apk/release/app-release.apk
