name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
          # No cache here to avoid the lockfile error
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with: 
          java-version: '21' # REQUIRED for bcprov 1.79
          distribution: 'temurin'

      # We are skipping the specialized Gradle Setup Action temporarily 
      # because the GitHub Cache Service is reporting "400" errors.
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Project Dependencies
        run: npm install
        
      - name: Install Capacitor CLI
        run: npm install -D typescript @capacitor/cli @capacitor/android --legacy-peer-deps
        
      - name: Build web app
        run: npm run build
        
      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/violin-reference.jks

      - name: Clean and Build signed release APK
        run: |
          chmod +x android/gradlew || true
          cd android
          # --no-daemon prevents background process issues
          # -g .gradle_home forces a fresh local environment
          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace \
            -g .gradle_home \
            -Pandroid.injected.signing.store.file=$PWD/app/violin-reference.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
            
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: violin-reference-release
          path: android/app/build/outputs/apk/release/app-release.apk
