name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with: 
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          # 1. Install project deps
          npm install --legacy-peer-deps
          
          # 2. Install BUILD TOOLS (The fix for your TypeScript error)
          # Capacitor needs typescript to read capacitor.config.ts
          npm install -D typescript @capacitor/cli@6.1.0 @capacitor/android@6.1.0 --legacy-peer-deps
        
      - name: Build Web App
        run: npm run build
        
      - name: Initialize Android Project
        run: |
          # Create the folder
          # We use --web-dir dist to match your vite config
          npx cap add android || true
          
          # CRITICAL: Disable Jetifier (Fixes the Bouncy Castle / bcprov crash)
          # We create the file if it doesn't exist and force the setting
          mkdir -p android
          echo "android.enableJetifier=false" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

          # Force SDK 34 for Java 21 compatibility
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/g' android/variables.gradle
          fi
      
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Decode Keystore
        run: |
          # Ensure the directory exists before decoding
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/violin-reference.jks

      - name: Build Signed Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$PWD/app/violin-reference.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: violin-reference-release
          path: android/app/build/outputs/apk/release/app-release.apk
