name: Build Android APK (On-The-Fly)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with: 
          java-version: '21'
          distribution: 'temurin'
        
      - name: Install Dependencies
        run: |
          npm install
          npm install -D @capacitor/cli @capacitor/android
        
      - name: Build Web App
        run: npm run build
        
      - name: Generate and Patch Android Folder
        run: |
          # 1. Create the folder
          npx cap add android
          
          # 2. DISABLE JETIFIER (The fix for Bouncy Castle crash)
          # This command searches for enableJetifier and sets it to false
          sed -i 's/android.enableJetifier=true/android.enableJetifier=false/g' android/gradle.properties
          
          # 3. FORCE SDK VERSIONS (Ensures compatibility with Java 21)
          # We update variables.gradle to use modern SDK targets
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/g' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/g' android/variables.gradle
      
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/violin-reference.jks

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$PWD/app/violin-reference.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: violin-reference-release
          path: android/app/build/outputs/apk/release/app-release.apk
